[package]
name = "application-core"
description = "AI Beauty Studio core: owns files and documents, schedules engine work"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
engine-sys = { path = "../engine-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Project files are ZIP containers; stored entries only (images are
# already compressed), so no compression libraries are needed.
zip = { version = "2", default-features = false }
